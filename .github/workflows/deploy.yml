name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if that's your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # REPLACE 'YOUR_REPO_NAME' below with your actual repository name!
        # Example: --base-href /my-portfolio/
        run: npx ng build --configuration production --base-href /coverletter_generator_ai/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This must match the "outputPath" in your angular.json
          path: dist/job-app-generator

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
